name: release

# Al crear una etiqueta (ej: v1.1.0) compila el APK firmado y lo publica en un Release.
# Al publicarse, las apps instaladas con una versión menor quedan bloqueadas hasta actualizar.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: La etiqueta debe coincidir con la versión de pubspec.yaml
        run: |
          VERSION_TAG="${GITHUB_REF_NAME#v}"
          VERSION_PUBSPEC="$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+[:space:]]+).*/\1/')"
          echo "etiqueta=$VERSION_TAG pubspec=$VERSION_PUBSPEC"
          if [ "$VERSION_TAG" != "$VERSION_PUBSPEC" ]; then
            echo "::error::La etiqueta ($VERSION_TAG) no coincide con pubspec.yaml ($VERSION_PUBSPEC). Sube la versión en pubspec.yaml antes de crear la etiqueta."
            exit 1
          fi

      - name: Verificar secretos de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE" ] || [ -z "$STORE_PASS" ] || [ -z "$KEY_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Faltan secretos de firma (ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS). Ver RELEASES.md."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Versión fija: es la misma con la que se verificó el build (AGP 9.3.1 / built-in Kotlin).
      # Al subirla, revisar android/settings.gradle.kts y gradle.properties.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.0"
          cache: true

      - name: Crear llave de firma
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PASS"
            echo "keyPassword=$KEY_PASS"
            echo "keyAlias=$KEY_ALIAS"
          } > android/key.properties

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Nombrar el APK
        run: cp build/app/outputs/flutter-apk/app-release.apk "vigila-funcionarios-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          files: vigila-funcionarios-${{ github.ref_name }}.apk
          generate_release_notes: true
